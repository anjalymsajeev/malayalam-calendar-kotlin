name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      # build = compile + unit tests + apiCheck + core dependency guard
      - run: ./gradlew build --no-daemon
      # Exit criterion of Sprint 3: an external project consumes the published artifacts.
      - run: ./gradlew publishToMavenLocal --no-daemon
      - run: ./gradlew -p samples/jvm-consumer run --no-daemon
